name: Build and verify Driving Studio v3

on:
  push:
    branches: [codex/driving-studio-v3-20261115]
    paths: ['.omoji-v3-build.json']

permissions:
  contents: write

concurrency:
  group: driving-studio-v3-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/codex/driving-studio-v3-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_BRANCH: codex/driving-studio-v3-20261115
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/driving-studio-v3-20261115
          fetch-depth: 0
      - name: Assert isolated work branch
        run: |
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test -f .omoji-v3-build.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare original composition tools
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Build original assets and static detail pages
        run: python tools/prepare-driving-v3.py
      - name: Verify economy, driving, saves, audio, SEO and geometry
        run: npm test
      - name: Verify public staging
        run: python tools/build-site.py --out "$RUNNER_TEMP/omoji-public"
      - name: Commit production assets only to the work branch
        run: |
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- assets cars courses cars.html courses.html guide.html sitemap.xml tools/verification-report.json .omoji-v3-build.json
          git commit -m 'Build verified v3 production assets and search pages'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
