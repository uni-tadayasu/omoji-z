name: Verify game and download ZIPs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify geometry, compatibility, assets and references
        run: npm test
      - name: Verify public file staging
        run: python3 tools/build-site.py --out "$RUNNER_TEMP/omoji-public"
      - name: Create full and changed-files ZIPs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '93733a076aa15f437793452d6aa270f39a01b48e' }}
        run: python3 tools/package-release.py --base-ref "$BASE_REF" --out "$RUNNER_TEMP/omoji-release"
      - name: Prepare separate full and changed-files downloads
        run: |
          python3 -m zipfile -e "$RUNNER_TEMP/omoji-release/omoji-z-full.zip" "$RUNNER_TEMP/omoji-full"
          python3 -m zipfile -e "$RUNNER_TEMP/omoji-release/omoji-z-update.zip" "$RUNNER_TEMP/omoji-update"
      - name: Download complete game
        uses: actions/upload-artifact@v4
        with:
          name: omoji-z-full
          path: ${{ runner.temp }}/omoji-full
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Download changed files only
        uses: actions/upload-artifact@v4
        with:
          name: omoji-z-update
          path: ${{ runner.temp }}/omoji-update
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
