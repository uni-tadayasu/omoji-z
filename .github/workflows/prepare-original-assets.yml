name: Prepare original game assets and download release

on:
  push:
    branches:
      - codex/original-design-v2-20261115
    paths:
      - '.omoji-transfer/**'

permissions:
  contents: write

concurrency:
  group: original-design-v2-asset-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/original-design-v2-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BRANCH: codex/original-design-v2-20261115
      BASE_COMMIT: d56dadaef293b97f88d9f017d8e65701be98e721
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out the isolated design branch
        uses: actions/checkout@v4
        with:
          ref: codex/original-design-v2-20261115
          fetch-depth: 0
          persist-credentials: true

      - name: Assert branch and check whether preparation is needed
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          if test -f .omoji-transfer/art.json; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'No temporary artwork transfer exists; preparation already completed.'
          fi

      - name: Set up Python
        if: steps.transfer.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        if: steps.transfer.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare composition dependencies
        if: steps.transfer.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.3.5
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/omoji-ffmpeg-encoders.txt" 2>&1
          grep -q 'libmp3lame' "$RUNNER_TEMP/omoji-ffmpeg-encoders.txt"

      - name: Restore artwork, compose all 128 tracks, and rebuild inventory
        if: steps.transfer.outputs.needed == 'true'
        run: python tools/prepare-original-assets.py

      - name: Verify source, geometry, catalog, and soundtrack
        if: steps.transfer.outputs.needed == 'true'
        run: node tools/verify.mjs --report "$RUNNER_TEMP/original-design-verification.json"

      - name: Commit generated assets to this branch only
        if: steps.transfer.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- assets/art/hero-photo.webp assets/art/share.png assets/art/icon-192.png assets/art/icon-512.png assets/art/favicon.ico assets/audio assets/asset-inventory.json .omoji-transfer
          if git diff --cached --quiet; then
            echo 'Verified assets already match the branch.'
          else
            git commit -m 'Build original artwork and all 128 original soundtrack files'
            git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          fi

      - name: Create full and changed-files downloads
        if: steps.transfer.outputs.needed == 'true'
        run: python tools/package-release.py --base-ref "$BASE_COMMIT" --out "$RUNNER_TEMP/omoji-release"

      - name: Upload complete and changed-files ZIPs
        if: steps.transfer.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: omoji-z-original-design-v2-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/omoji-release/omoji-z-full.zip
            ${{ runner.temp }}/omoji-release/omoji-z-update.zip
            ${{ runner.temp }}/omoji-release/release-summary.json
            ${{ runner.temp }}/original-design-verification.json
          if-no-files-found: error
          retention-days: 14
